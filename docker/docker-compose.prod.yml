# ──────────────────────────────────────────────────────────
#  Code Tutor Agent — 生产模式的 docker-compose override
#  用法:
#     docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # 🔴 必须挂载命名卷持久化 data/：JWT 密钥文件(.jwt_secret)、编辑轨迹等都在这里。
    # 不挂的话，容器重建会丢失登录态（JWT 密钥重新随机 → 旧 token 全失效）。
    # 业务数据 + LangGraph checkpoint 已迁 PostgreSQL（2026-09-07）：
    # 在 app-db 容器的 app_postgres_data 卷里，备份请用 pg_dump 而非复制本卷。
    volumes:
      - cta_data:/app/data
    environment:
      - UVICORN_RELOAD=false
      # JWT 密钥：留空（默认）时应用首次启动生成随机密钥并持久化到挂载卷 data/db/.jwt_secret，
      # 配合上方命名卷即可在重建容器后保持登录态稳定。如需显式指定可在 .env 设 JWT_SECRET。
      - JWT_SECRET=${JWT_SECRET:-}
    deploy:
      # 🔴 固定为 1 副本：数据库已迁移 PostgreSQL（2026-09-07，写并发已根治），
      # 但 _generation_progress（SSE 出题进度）仍是单容器内存态，且 JWT 密钥文件
      # 挂载在 data 卷；多副本会导致进度丢失、跨副本 token 互不相认。
      # 水平扩展前还需把进度态挪到 Redis 等外部 KV。
      replicas: 1
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE: /
    environment: []
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

# 持久化卷（cta_data = JWT 密钥 / 编辑轨迹等 data 文件；业务数据 + checkpoint
# 在主 compose 的 app_postgres_data 卷，由 app-db 容器承载，重建容器不丢失）
volumes:
  cta_data:
    driver: local