# docker-compose.yml 引用的 nginx 配置
# 生产模式：前端 nginx 反向代理 API → 后端

# API 限流（审计 F-07）：每 IP 20 r/s，burst 40 突发容忍（正常页面加载绰绰有余，
# 防脚本化轰击）。SSE 长连接只在建连时计一次，不受影响。
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream backend {
    server backend:8765;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（审计 F-07）。
    # HSTS / CSP 待 HTTPS 与内联样式核查后启用（误配 CSP 会白屏，先留注释模板）：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 全站限流（server 级对所有 location 生效）
    limit_req zone=api burst=40 nodelay;

    # 静态资源缓存（⚠️ nginx add_header 继承规则：本块有自己的 add_header，
    # 会整体覆盖 server 级安全头，故此处必须重复声明）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 后端 API 反向代理（SSE 需关闭缓冲 + 延长读超时）
    # 注意：用 /session（不带尾斜杠）前缀匹配，可同时覆盖 /session 与 /session/...
    # 否则 POST /session（无尾斜杠，创建会话）会落入下方 SPA 回退被吞掉
    location /session {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /problems {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 题目标签/主题接口（后端 /topics 路由，无尾斜杠）
    location /topics {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /problem/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 用户级 LLM 设置（设置页"模型服务"）：GET/PUT /settings/me、POST /settings/me/test
    # ⚠️ 漏掉会被下方 SPA 回退吞成 index.html → 前端 JSON.parse 抛 "Unexpected token '<'"
    location /settings {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 公告横幅（GET /announcements）
    location /announcements {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 前端错误上报（POST /client/errors）
    location /client {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 多租户鉴权接口（登录/注册/me/profile）——生产走 nginx 反代时必须转发，
    # 否则会被下方 SPA 回退吞掉，导致登录/注册 404。
    location /auth {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
