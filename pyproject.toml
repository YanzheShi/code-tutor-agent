[project]
name = "code-tutor-agent"
version = "0.1.0"
description = "AI-powered coding tutor with multi-agent architecture and MCP integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    # LangChain 1.x 生态（注意是 1.x，不是 0.3）
    "langchain>=1.3.0,<2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=1.3.0,<2.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    # 数据建模
    "mcp>=1.0.0",
    "pydantic>=2.9.0",
    # 环境变量管理
    "python-dotenv>=1.0.0",
    # Token 计数（上下文管理）
    "tiktoken>=0.7.0",
    # API 层
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_tutor_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# ── CLI entry points (installed via pip/uv) ──
#   uv run code-tutor-api          → FastAPI 后端
#   uv run judge0-mcp-server       → Judge0 MCP Server
[project.scripts]
code-tutor-api = "code_tutor_agent.api.run:main"
judge0-mcp-server = "code_tutor_agent.mcp.judge0_server:main"
